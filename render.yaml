databases:
  - name: visionary-db
    databaseName: visionary
    user: visionary
    plan: free
    region: singapore

services:
  - type: web
    name: visionary-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /health/ready
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: visionary-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: Jwt__Issuer
        value: VisionaryApi
      - key: Jwt__Audience
        value: VisionaryClients
