services:
  - type: web
    name: visionary-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false # Set securely in Render Dashboard (Environment -> Environment Variables)
      - key: JWT_SECRET
        sync: false # Set securely in Render Dashboard (Environment -> Environment Variables, min 32 chars)
      - key: Jwt__Key
        sync: false # Fallback binding to JWT_SECRET
      - key: Jwt__Issuer
        value: VisionaryApi
      - key: Jwt__Audience
        value: VisionaryClients

