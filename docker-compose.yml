services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=visionary_db;Username=postgres;Password=VisionarySecureDbPassword2026
      - Jwt__Key=VisionaryPlatformSecretKey2026MasterExecutionSecureKeyDNTU_TH71108_API
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: visionary_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: VisionarySecureDbPassword2026
      POSTGRES_DB: visionary_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: visionary_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
