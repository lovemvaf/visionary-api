name: Mobile CI - Android Native Java

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        working-directory: ./mobile/VisionaryAndroid
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./mobile/VisionaryAndroid
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Visionary-StudentConnect-APK
          path: mobile/VisionaryAndroid/app/build/outputs/apk/debug/app-debug.apk
