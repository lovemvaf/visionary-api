name: Security Audit & Supply Chain Hardening

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    name: DevSecOps Vulnerability & Secret Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit Backend NuGet Packages
        run: |
          echo "Scanning backend NuGet dependencies for known CVEs..."
          dotnet list backend/Visionary.Backend.sln package --vulnerable --include-transitive

      - name: Audit Frontend npm Dependencies & Enforce Security Policy
        working-directory: ./frontend
        run: |
          echo "Running structured npm security audit..."
          npm audit --json > ../npm-audit-report.json || true
          # Verify dependency vulnerabilities against documented exception policy
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("../npm-audit-report.json", "utf8"));
            const vulns = report.vulnerabilities || {};
            const allowedPackages = new Set(["next", "postcss", "postcss-nested", "postcss-selector-parser", "tailwindcss"]);
            const unhandled = Object.keys(vulns).filter(pkg => !allowedPackages.has(pkg));
            if (unhandled.length > 0) {
              console.error("CRITICAL SECURITY ERROR: Unhandled vulnerabilities found in dependencies:", unhandled);
              process.exit(1);
            }
            console.log("Security Audit PASS: All detected vulnerabilities are documented in docs/security/DEPENDENCY_VULNERABILITY_REPORT.md");
          '

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Security Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: |
            npm-audit-report.json
          retention-days: 14
